name: toy pipeline test
on: [push]
jobs: 
  build:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: toy_pipeline
    steps:
           - uses: actions/checkout@v6
           - uses: actions/setup-python@v5
             with:
                  python-version: '3.11'
           - run: pip install -r requirements-test.txt
           - run: pytest
